<form nz-form [formRoot]="loginForm" (keydown)="keyDown($event)" class="ck-login-form">
    <nz-form-item>
        <nz-form-control nzHasFeedback [nzErrorTip]="userNameError">
            <nz-input-wrapper>
                <fa-icon nzInputPrefix class="ck-btn-icon" [icon]="userIcon"></fa-icon>
                <input nz-input autocomplete="username" type="text" [formField]="loginForm.userName" [placeholder]="'CK.BasicLogin.UserName.Placeholder' | translate" />
            </nz-input-wrapper>
        </nz-form-control>
        <ng-template #userNameError>
            @if (loginForm.userName().invalid()) {
                <span class="ck-login-form-text">{{ 'CK.BasicLogin.UserName.Required' | translate }}</span>
            }
            <!-- <UserNameValidationError /> -->
        </ng-template>
    </nz-form-item>
    <nz-form-item>
        <nz-form-control nzHasFeedback [nzErrorTip]="passwordError">
            <nz-input-password [(nzVisible)]="showPassword">
                <fa-icon nzInputPrefix class="ck-btn-icon" [icon]="passwordIcon"></fa-icon>
                <input
                    nz-input
                    autocomplete="current-password"
                    id="password"
                    [formField]="loginForm.password"
                    [placeholder]="'CK.BasicLogin.Password.Placeholder' | translate" />
                <ng-template nzInputPasswordIcon let-visible>
                    <fa-icon [icon]="visible ? eyeIcon : eyeSlashIcon"></fa-icon>
                </ng-template>
            </nz-input-password>
            <ng-template #passwordError>
                @if (loginForm.password().invalid()) {
                    <span class="ck-login-form-text">{{ 'CK.BasicLogin.Password.Required' | translate }}</span>
                }
                <!-- <PasswordValidationError /> -->
            </ng-template>
        </nz-form-control>
    </nz-form-item>
    <nz-form-item class="ck-login-form-item">
        <label nz-checkbox [formField]="loginForm.rememberMe" class="remember">
            <span class="ck-login-form-text">{{ 'CK.BasicLogin.RememberMe.Label' | translate }}</span>
        </label>
        <!-- <PasswordLost /> -->
    </nz-form-item>
</form>
<button class="login-form-button" nz-button type="submit" nzType="primary" nzSize="large" [disabled]="loginForm().invalid()" (click)="submit()">
    <span class="text">{{ 'Button.Login' | translate }}</span>
</button>
